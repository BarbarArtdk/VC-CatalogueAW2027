<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vanilla Copenhagen – Catalogue AW 2027</title>
<meta name="description" content="Vanilla Copenhagen – Catalogue Autumn/Winter 2027">
<style>
:root{
  --bg:#F2EFEA; --ink:#7F7F7F; --ink-strong:#5E5A55; --line:#7F7F7F; --panel:#FFFFFF;
  --c1:#EFB661; --c2:#AE8A79; --c3:#9AC09D; --c4:#517DB9; --neutral:#D6D2C4;
  --shadow:0 10px 40px rgba(60,50,40,.18);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);font-family:"Liberation Sans",Arial,Helvetica,sans-serif;color:var(--ink-strong);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
/* top bar */
.bar{position:fixed;left:0;right:0;top:0;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:20}
.brand{display:flex;align-items:center;gap:12px;white-space:nowrap;overflow:hidden;min-width:0}
.brand .logo{height:38px;width:auto;flex:0 0 auto;display:block}
.brand small{font-family:"Liberation Sans",Arial,sans-serif;font-size:12px;letter-spacing:.12em;color:var(--ink);text-transform:uppercase;padding-top:6px}
.tools{display:flex;gap:10px}
.ib{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;transition:background .15s}
.ib svg{width:40px;height:40px}
.ib:hover{background:rgba(127,127,127,.10)}
.ib:focus-visible{outline:2px solid var(--c4);outline-offset:2px}
.ib .frame{fill:none;stroke:var(--line);stroke-width:1.5}
.ib .g{fill:none;stroke:var(--line);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
/* stage */
.stage{position:fixed;left:0;right:0;top:64px;bottom:96px;display:flex;align-items:center;justify-content:center;perspective:2600px}
.book{position:relative;display:flex;box-shadow:none}
.half{position:relative;width:var(--pw);height:var(--ph);background:#fff;overflow:hidden}
.half.empty{background:transparent}
.half img,.leaf img{width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.half.l{box-shadow:var(--shadow)}
.half.r{box-shadow:var(--shadow)}
.half.empty{box-shadow:none}
.half.l::after{content:"";position:absolute;inset:0 0 0 auto;width:28px;background:linear-gradient(to left,rgba(0,0,0,.10),rgba(0,0,0,0));pointer-events:none}
.half.r::after{content:"";position:absolute;inset:0 auto 0 0;width:28px;background:linear-gradient(to right,rgba(0,0,0,.10),rgba(0,0,0,0));pointer-events:none}
.half.empty::after,.single .half::after{display:none}
.leaf{position:absolute;top:0;width:var(--pw);height:var(--ph);transform-style:preserve-3d;z-index:5;will-change:transform}
.leaf .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#fff;overflow:hidden}
.leaf .back{transform:rotateY(180deg)}
.leaf .face::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to right,rgba(0,0,0,0) 60%,rgba(0,0,0,.12));opacity:var(--sh,0)}
.hot{position:absolute;display:block;border-radius:3px;transition:background .15s}
.hot:hover{background:rgba(81,125,185,.12)}
.edge{position:absolute;top:0;bottom:0;width:12%;z-index:6;cursor:pointer}
.edge.prev{left:0}.edge.next{right:0}
.edge::after{content:"";position:absolute;top:0;bottom:0;width:100%;opacity:0;transition:opacity .2s}
.edge.prev::after{background:linear-gradient(to right,rgba(0,0,0,.08),transparent)}
.edge.next::after{background:linear-gradient(to left,rgba(0,0,0,.08),transparent)}
.edge:hover::after{opacity:1}
/* bottom */
.foot{position:fixed;left:0;right:0;bottom:0;height:96px;display:flex;align-items:center;gap:14px;padding:0 16px 10px;z-index:20}
.nav{flex:0 0 auto}
.indicator{flex:1 1 auto;min-width:0;position:relative;height:62px}
.cats{position:absolute;left:0;right:0;top:4px;height:16px}
.cats span{position:absolute;top:0;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:4px}
.track{position:absolute;left:0;right:0;top:28px;height:6px;border-radius:3px;background:var(--neutral);cursor:pointer}
.seg{position:absolute;top:0;height:100%}
.seg:first-of-type{border-radius:3px 0 0 3px}
.mark{position:absolute;top:-7px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:#fff;border:1.5px solid var(--ink-strong);transition:left .35s ease;pointer-events:none}
.pnum{position:absolute;left:0;right:0;top:44px;text-align:center;font-size:12px;color:var(--ink)}
.tip{position:absolute;top:-30px;transform:translateX(-50%);background:#fff;border:1px solid #ddd;border-radius:6px;padding:3px 7px;font-size:11px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s}
/* panels */
.scrim{position:fixed;inset:0;background:rgba(40,35,30,.25);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.scrim.on{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;bottom:0;right:0;width:min(420px,100%);background:var(--panel);box-shadow:-10px 0 40px rgba(0,0,0,.12);transform:translateX(102%);transition:transform .25s ease;z-index:31;display:flex;flex-direction:column}
.panel{visibility:hidden}.panel.on{transform:none;visibility:visible}
.panel.wide{width:min(980px,100%)}
.ph{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #eee}
.ph h2{margin:0;font-family:"Times New Roman",Times,serif;font-weight:normal;font-size:24px;color:var(--ink-strong)}
.pb{overflow:auto;padding:12px 16px 24px;flex:1}
.toc a{display:flex;justify-content:space-between;align-items:center;padding:14px 4px;border-bottom:1px solid #f0f0f0;color:var(--ink-strong);text-decoration:none;font-size:16px}
.toc a:hover{background:#faf8f5}
.toc i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:10px;vertical-align:-1px}
.toc em{font-style:normal;color:var(--ink);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px}
.sp{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;border-radius:8px;padding:6px}
.sp:hover{background:#faf8f5}
.sp.cur{outline:2px solid var(--c4)}
.sp .two{display:flex;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.sp img{width:66px;height:auto;display:block;background:#fff}
.sp .ph0{width:66px}
.sp small{font-size:11px;color:var(--ink)}
.search input{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1.5px solid #ddd;border-radius:10px;outline:none;color:var(--ink-strong)}
.search input:focus{border-color:var(--c4)}
.res{margin-top:12px}
.res a{display:flex;gap:12px;padding:10px 6px;border-bottom:1px solid #f2f2f2;text-decoration:none;color:var(--ink-strong);border-radius:6px}
.res a:hover{background:#faf8f5}
.res img{width:48px;height:auto;flex:0 0 auto;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.res b{font-weight:normal;font-size:13px;color:var(--ink)}
.res p{margin:3px 0 0;font-size:13px;line-height:1.4}
.res mark{background:#F5E1A4;color:inherit}
.empty-msg{color:var(--ink);font-size:14px;padding:10px 2px}
/* single page mode */
.single .half.l{display:none}
@media (max-width:640px){
  .brand .logo{height:30px}
  .brand small{display:none}
  .tools{gap:4px}
  .ib{width:36px;height:36px}.ib svg{width:36px;height:36px}
  .cats span{font-size:9px}
}
@media (prefers-reduced-motion:reduce){.leaf{transition:none!important}}
</style>
</head>

<script>
(function(){

const book=$('book'),L=$('L'),R=$('R');

// preload
const cache={};function pre(p){if(p>=1&&p<=N&&!cache[p]){const i=new Image();i.src=src(p);cache[p]=i}}
// spreads: [null,1],[2,3],...,[N] (N even -> last alone on left)
function spreadOf(p){ if(single) return [p,null]; if(p===1) return [null,1]; const l=p%2===0?p:p-1; return [l, l+1<=N?l+1:null]; }
function firstOf(p){const s=spreadOf(p);return s[0]||s[1]}
function size(){
  single = innerWidth<760 || innerWidth/innerHeight<0.95;

  const st=$('stage').getBoundingClientRect();
  const ar=842/595.2, cols=single?1:2, pad=single?12:28;
  let ph=st.height-pad*2, pw=ph/ar;
  if(pw*cols>st.width-pad*2){pw=(st.width-pad*2)/cols; ph=pw*ar}
  book.style.setProperty('--pw',pw+'px');book.style.setProperty('--ph',ph+'px');
  document.querySelectorAll('.leaf').forEach(e=>{e.style.setProperty('--pw',pw+'px');e.style.setProperty('--ph',ph+'px')});
}
function fill(el,p){
  el.innerHTML=''; el.classList.toggle('empty',!p);
  if(!p) return;
  const im=new Image(); im.src=src(p); im.alt='Side '+p; im.draggable=false; el.appendChild(im);
  D.links.filter(k=>k.p===p).forEach(k=>{
    const a=document.createElement('a'); a.className='hot';

    if(k.t==='uri'){a.href=k.v; if(!k.v.startsWith('mailto')&&!k.v.startsWith('tel')){a.target='_blank';a.rel='noopener'} a.title=k.v.replace(/^mailto:|^tel:/,'')}
    else{a.href='#p='+k.v; a.title='Gå til side '+k.v; a.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();go(k.v)})}
    el.appendChild(a);
  });
}
function show(p){
  cur=p; const [l,r]=spreadOf(p);
  if(single){fill(R,l)} else {fill(L,l);fill(R,r)}
  [l,r].forEach(x=>{if(x){pre(x-2);pre(x-1);pre(x+1);pre(x+2);pre(x+3)}});
  update();

}
function update(){
  const [l,r]=spreadOf(cur); const a=l||r,b=r||l;

function leaf(front,back,dir){ // dir 1 = forward (right page turns left), -1 = backward
  const lf=document.createElement('div'); lf.className='leaf';
  const pw=book.style.getPropertyValue('--pw'), ph=book.style.getPropertyValue('--ph');
  lf.style.setProperty('--pw',pw);lf.style.setProperty('--ph',ph);
  const f=document.createElement('div'); f.className='face front'; const b=document.createElement('div'); b.className='face back';

  lf.append(f,b);
  if(single){lf.style.left='0';lf.style.transformOrigin='left center'}
  else if(dir>0){lf.style.left=pw;lf.style.transformOrigin='left center'}
  else{lf.style.left='0';lf.style.transformOrigin='right center'}
  book.appendChild(lf); return lf;
}
function turn(dir){
  if(busy) return; const [l,r]=spreadOf(cur); const a=l||r,b=r||l;
  let target = single ? cur+dir : (dir>0 ? b+1 : a-1);
  if(target<1||target>N) return;

  const [nl,nr]=spreadOf(target);
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

  busy=true; let lf;

    lf=leaf(dir>0?cur:target, null, dir); fill(R, dir>0?target:cur);

  } else if(dir>0){
    lf=leaf(r,nl,dir); fill(R,nr);
  } else {
    lf=leaf(l,nr,dir); fill(L,nl);
  }
  lf.style.transition='none';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    lf.style.transition='transform .75s cubic-bezier(.45,.05,.25,1)';
    if(single) lf.style.transform= dir>0?'rotateY(-180deg)':'rotateY(0deg)';

function go(p){ p=Math.max(1,Math.min(N,p|0)); closeAll(); show(firstOf(p)); }
// indicator
function buildIndicator(){
  const tr=$('track'), cats=$('cats');

document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeAll); $('scrim').onclick=closeAll;
function buildToc(){
  const items=[['Forside',1,null],['Trade & GSPR',2,null],['Indhold',3,null]].concat(D.sections.map((s,i)=>[s.name,s.start,i,s.end])).concat([['Bagside',N,null]]);

  const ql=q.toLowerCase(), out=[];
  D.texts.forEach((t,i)=>{const tl=t.toLowerCase(); let k=tl.indexOf(ql); if(k<0) return;
    let cnt=0,j=k; while(j>=0){cnt++;j=tl.indexOf(ql,j+ql.length)}
    const a=Math.max(0,k-50),b=Math.min(t.length,k+q.length+70);
    const snip=(a>0?'… ':'')+esc(t.slice(a,k))+'<mark>'+esc(t.slice(k,k+q.length))+'</mark>'+esc(t.slice(k+q.length,b))+(b<t.length?' …':'');
    out.push(`<a href="#p=${i+1}" data-p="${i+1}"><img src="${th(i+1)}" alt=""><div><b>Side ${i+1} · ${cnt} fund</b><p>${snip}</p></div></a>`)});
  box.innerHTML=out.length?out.join(''):'<div class="empty-msg">Ingen resultater for “'+esc(q)+'”.</div>';
  box.querySelectorAll('a').forEach(a=>a.onclick=e=>{e.preventDefault();go(+a.dataset.p)});
}
let tq; $('q').addEventListener('input',e=>{clearTimeout(tq);tq=setTimeout(()=>search(e.target.value),150)});
// buttons
$('bHome').onclick=()=>go(1); $('bGrid').onclick=()=>open('pGrid'); $('bToc').onclick=()=>open('pToc'); $('bSearch').onclick=()=>open('pSearch');
$('bPrev').onclick=()=>turn(-1); $('bNext').onclick=()=>turn(1); $('ePrev').onclick=()=>turn(-1); $('eNext').onclick=()=>turn(1);
$('bFull').onclick=()=>{ if(!document.fullscreenElement){(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen||function(){}).call(document.documentElement)} else {(document.exitFullscreen||document.webkitExitFullscreen).call(document)} };
document.addEventListener('fullscreenchange',()=>{$('fsIcon').setAttribute('d',document.fullscreenElement?'M17 12v5h-5M23 12v5h5M17 28v-5h-5M23 28v-5h5':'M12 17v-5h5M28 17v-5h-5M12 23v5h5M28 23v5h-5');setTimeout(()=>{size();show(cur)},60)});
addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT') {if(e.key==='Escape')closeAll();return}
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();turn(1)} else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();turn(-1)}
  else if(e.key==='Home'){go(1)} else if(e.key==='End'){go(N)} else if(e.key==='Escape'){closeAll()} else if(e.key==='/'||(e.key==='f'&&(e.ctrlKey||e.metaKey))){e.preventDefault();open('pSearch')} });
// swipe
let sx=null,sy=null; $('stage').addEventListener('touchstart',e=>{if(e.touches.length===1){sx=e.touches[0].clientX;sy=e.touches[0].clientY}},{passive:true});
$('stage').addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy))turn(dx<0?1:-1);sx=null},{passive:true});
let rt; addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{const was=single;size();if(was!==single)show(firstOf(cur));},120)});
addEventListener('hashchange',()=>{const m=location.hash.match(/p=(\d+)/);if(m&&firstOf(+m[1])!==firstOf(cur))show(firstOf(+m[1]))});
// init
buildIndicator();buildToc();buildGrid();size();
const m=location.hash.match(/p=(\d+)/); show(firstOf(m?+m[1]:1));
})();
